name: TestFlight

# 手动触发：GitHub → Actions → TestFlight → Run workflow
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "版本号（CFBundleShortVersionString），例如 0.1.0"
        required: true
        default: "0.1.0"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload to TestFlight
    runs-on: macos-26
    env:
      # 在 Settings → Secrets and variables → Actions 中配置（见 README「发布到 TestFlight」）
      # 两套 Secret 名字都支持：APP_STORE_CONNECT_* 或简写 ASC_*
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY || secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Bundle ID 已写在 project.yml；如需覆盖可设置变量 APP_BUNDLE_ID
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.xianlisi.seichijunrei' }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: config
        run: |
          missing=()
          [ -n "$ASC_KEY_ID" ]    || missing+=("secret APP_STORE_CONNECT_API_KEY_ID（或 ASC_KEY_ID）")
          [ -n "$ASC_ISSUER_ID" ] || missing+=("secret APP_STORE_CONNECT_ISSUER_ID（或 ASC_ISSUER_ID）")
          [ -n "$ASC_KEY" ]       || missing+=("secret APP_STORE_CONNECT_API_KEY（或 ASC_KEY_P8）")
          [ -n "$TEAM_ID" ]       || missing+=("variable APPLE_TEAM_ID")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ 未配置签名，只做不签名的打包演练（不会上传）"
              echo "缺少："
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo
              echo "配置方法见 README「发布到 TestFlight」。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect API key
        if: steps.config.outputs.signed == 'true'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          # 支持直接粘贴 .p8 文本，或 base64 编码后的内容
          if printf '%s' "$ASC_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: steps.config.outputs.signed == 'true'
        run: |
          set -o pipefail
          xcodebuild -project SeichiJunrei.xcodeproj -scheme SeichiJunrei \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SeichiJunrei.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -n 80

      - name: Upload to App Store Connect (TestFlight)
        if: steps.config.outputs.signed == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SeichiJunrei.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 80
          {
            echo "### ✅ 已上传到 App Store Connect"
            echo "版本 \`$MARKETING_VERSION\`（构建号 \`$BUILD_NUMBER\`）。苹果处理完成后（通常 5–30 分钟）会出现在 TestFlight 中。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive (unsigned dry run)
        if: steps.config.outputs.signed != 'true'
        run: |
          set -o pipefail
          xcodebuild -project SeichiJunrei.xcodeproj -scheme SeichiJunrei \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SeichiJunrei.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO archive | tail -n 60
          echo "Release 打包演练成功（未签名、未上传）。" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
