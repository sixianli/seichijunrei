name: SeichiJunrei
options:
  bundleIdPrefix: com.xianlisi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # 免费公测期：NO。数据校准完成、准备收费时改为 YES
    SEICHI_PAYWALL_ENABLED: "NO"
    # 设置页“联系我们”的邮箱。不写进源码：发布时由 GitHub 仓库变量 CONTACT_EMAIL 注入
    SEICHI_CONTACT_EMAIL: ""
    CURRENT_PROJECT_VERSION: "1"
packages:
  SeichiCore:
    path: Packages/SeichiCore
targets:
  SeichiJunrei:
    type: application
    platform: iOS
    sources:
      - path: SeichiJunrei
    dependencies:
      - package: SeichiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xianlisi.seichijunrei
        CODE_SIGN_ENTITLEMENTS: SeichiJunrei/SeichiJunrei.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Seichi Junrei
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to find pilgrimage spots near you and to tell when you're standing at a scene's spot."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Lets the app alert you when you're near a pilgrimage spot, even when it isn't open."
        INFOPLIST_KEY_NSCameraUsageDescription: "Used at a scene's spot to line up the camera with the same shot as in the story."
        INFOPLIST_KEY_NSMotionUsageDescription: "Uses the gyroscope and compass to tell which way you're facing and guide you to the scene's view."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Saves the photos you take at pilgrimage spots to your library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "When you share a photo, the app reads where it was taken to check it was shot near the scene."
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: SeichiJunrei/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # 收费开关（见 SeichiJunrei/App/AppConfig.swift）
        SeichiPaywallEnabled: $(SEICHI_PAYWALL_ENABLED)
        SeichiContactEmail: $(SEICHI_CONTACT_EMAIL)
        # 导航时检测这些地图 App 是否已安装（Google 地图 / 高德地图 / 百度地图）
        LSApplicationQueriesSchemes: [comgooglemaps, iosamap, baidumap]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 只使用系统提供的加密（HTTPS），无需每次上传后手动回答出口合规问题
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [gps, magnetometer]
  SeichiJunreiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeichiJunreiUITests
    dependencies:
      - target: SeichiJunrei
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xianlisi.seichijunrei.uitests
        TEST_TARGET_NAME: SeichiJunrei
  SeichiJunreiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeichiJunreiTests
      - path: SeichiJunrei.storekit
        buildPhase: resources
    dependencies:
      - target: SeichiJunrei
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xianlisi.seichijunrei.tests
schemes:
  SeichiJunrei:
    build:
      targets:
        SeichiJunrei: all
    run:
      storeKitConfiguration: SeichiJunrei.storekit
    test:
      targets:
        - SeichiJunreiTests
        - SeichiJunreiUITests
