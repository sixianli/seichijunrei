name: SeichiJunrei
options:
  bundleIdPrefix: com.example.seichijunrei
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SeichiCore:
    path: Packages/SeichiCore
targets:
  SeichiJunrei:
    type: application
    platform: iOS
    sources:
      - path: SeichiJunrei
    dependencies:
      - package: SeichiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seichijunrei
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 圣地巡礼
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于发现你附近的动画圣地，并判断你是否已经站在名场面的机位上。
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: 开启后，当你靠近动画圣地时会收到提醒，即使 App 没有打开。
        INFOPLIST_KEY_NSCameraUsageDescription: 在名场面机位上通过相机取景，帮你对准动画中的同一个画面。
        INFOPLIST_KEY_NSMotionUsageDescription: 通过陀螺仪和指南针判断你面朝的方向，引导你转向名场面的视角。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把你在圣地拍下的“名场面重现”照片保存到相册。
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: SeichiJunrei/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [gps, magnetometer]
  SeichiJunreiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeichiJunreiUITests
    dependencies:
      - target: SeichiJunrei
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seichijunrei.uitests
        TEST_TARGET_NAME: SeichiJunrei
schemes:
  SeichiJunrei:
    build:
      targets:
        SeichiJunrei: all
    test:
      targets:
        - SeichiJunreiUITests
